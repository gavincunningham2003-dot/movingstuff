# CATRIX local stack. Start with:  docker compose up --build
# This file is provided for deployment; nothing here is started automatically.
services:
  db:
    image: postgis/postgis:16-3.4
    # Stock PostgreSQL defaults are sized for a tiny machine (128 MB cache, 4 MB sorts).
    # These suit a 16 GB+ development host; spatial joins and GiST index builds benefit
    # most. Lower them on a small VM.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_wal_size=2GB
    shm_size: 1gb
    environment:
      POSTGRES_USER: catrix
      POSTGRES_PASSWORD: catrix
      POSTGRES_DB: catrix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catrix -d catrix"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      CATRIX_DATABASE_URL: postgresql+psycopg://catrix:catrix@db:5432/catrix
      CATRIX_DATA_DIR: /data
      CATRIX_REGISTRY_FILE: /app/data_sources.yaml
      CATRIX_JOB_RUNNER: worker  # the worker service runs portfolio jobs, not the API
      CATRIX_LOG_JSON: "true"
    volumes:
      - ./data:/data
      - ./data_sources.yaml:/app/data_sources.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn catrix.api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    environment:
      CATRIX_DATABASE_URL: postgresql+psycopg://catrix:catrix@db:5432/catrix
      CATRIX_DATA_DIR: /data
      CATRIX_REGISTRY_FILE: /app/data_sources.yaml
      CATRIX_LOG_JSON: "true"
    volumes:
      - ./data:/data
      - ./data_sources.yaml:/app/data_sources.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    command: python -m catrix.pipeline.worker

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow:/mlflow
    ports:
      - "5000:5000"
    profiles: ["mlflow"]

volumes:
  pgdata:
  mlflow:
