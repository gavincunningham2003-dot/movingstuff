name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: catrix
          POSTGRES_PASSWORD: catrix
          POSTGRES_DB: catrix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catrix -d catrix_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (GDAL/GEOS/PROJ for rasterio, pyogrio, shapely wheels)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy catrix
      - name: Unit tests
        run: pytest tests/unit -q --cov=catrix --cov-report=term-missing
      - name: Integration tests (PostGIS)
        env:
          CATRIX_TEST_DATABASE_URL: postgresql+psycopg://catrix:catrix@localhost:5432/catrix_test
        run: pytest tests/integration -q -m integration
      - name: Migrations apply cleanly to an empty database (head, downgrade one, head)
        env:
          CATRIX_DATABASE_URL: postgresql+psycopg://catrix:catrix@localhost:5432/catrix_test
        run: |
          psql postgresql://catrix:catrix@localhost:5432/catrix_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; CREATE EXTENSION IF NOT EXISTS postgis;"
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Real browser against the real API and an empty, migrated PostGIS database: the
    # example portfolio uploads, validates (25 rows / 24 valid / 1 exact duplicate / 1 shared
    # location) and reaches a completed analysis with every hazard "unavailable".
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: catrix
          POSTGRES_PASSWORD: catrix
          POSTGRES_DB: catrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catrix -d catrix"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install backend
        run: pip install -e "backend[dev]"
      - name: Migrate
        working-directory: backend
        env:
          CATRIX_DATABASE_URL: postgresql+psycopg://catrix:catrix@localhost:5432/catrix
        run: alembic upgrade head
      - name: Start API
        env:
          CATRIX_DATABASE_URL: postgresql+psycopg://catrix:catrix@localhost:5432/catrix
          CATRIX_DATA_DIR: ./data
        run: |
          nohup catrix api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && break; sleep 2; done
      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test
      - name: API log
        if: always()
        run: tail -n 200 api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  live-sources:
    # Opt-in: verifies the public data endpoints still answer with the expected schema.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/live -q -m live
