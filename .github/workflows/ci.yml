name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: catrix
          POSTGRES_PASSWORD: catrix
          POSTGRES_DB: catrix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catrix -d catrix_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (GDAL/GEOS/PROJ for rasterio, pyogrio, shapely wheels)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy catrix
      - name: Unit tests
        run: pytest tests/unit -q --cov=catrix --cov-report=term-missing
      - name: Integration tests (PostGIS)
        env:
          CATRIX_TEST_DATABASE_URL: postgresql+psycopg://catrix:catrix@localhost:5432/catrix_test
        run: pytest tests/integration -q -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  live-sources:
    # Opt-in: verifies the public data endpoints still answer with the expected schema.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/live -q -m live
