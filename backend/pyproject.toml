[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catrix"
version = "0.1.0"
description = "CATRIX — California Catastrophe Risk Intelligence Platform (backend)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.32,<2.1",
  "geoalchemy2>=0.15,<0.16",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.13,<1.14",
  "pyarrow>=17,<18",
  "pandas>=2.2,<2.3",
  "numpy>=1.26,<2.1",
  "geopandas>=1.0,<1.1",
  "shapely>=2.0.5,<2.1",
  "pyproj>=3.6,<3.7",
  "rasterio>=1.3.10,<1.4",
  "pyogrio>=0.9,<0.10",
  "httpx>=0.27,<0.28",
  "duckdb>=1.0,<1.2",
  "scikit-learn>=1.5,<1.6",
  "xgboost>=2.1,<2.2",
  "shap>=0.46,<0.47",
  "joblib>=1.4,<1.5",
  "structlog>=24.4,<25",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.9,<0.1",
  "typer>=0.12,<0.13",
  "tenacity>=8.5,<9",
]

[project.optional-dependencies]
ml-extra = ["lightgbm>=4.5,<4.6", "optuna>=3.6,<4", "mlflow>=2.16,<2.17"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<1.12",
  "types-PyYAML",
  "pandas-stubs",
  "respx>=0.21,<0.22",
  "httpx>=0.27,<0.28",
]

[project.scripts]
catrix = "catrix.pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["catrix*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
# E501: ruff-format wraps code; remaining long lines are user-facing strings/SQL.
# N803/N806: X/T are standard ML notation. RUF001-003: en-dashes in user-facing text.
ignore = ["RUF012", "B008", "E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a live PostGIS database (CATRIX_TEST_DATABASE_URL)",
  "live: performs real network downloads (opt-in)",
  "slow: longer-running unit tests (synthetic model training)",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
