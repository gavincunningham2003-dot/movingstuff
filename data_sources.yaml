    temporal_coverage: 1984–present
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: local_only
    planned: true  # manual download behind an anti-bot form; no connector
    notes: >
      The MTBS direct-download page is a JavaScript application behind an antibot form; no
      stable file URL could be confirmed. Download the CONUS burned-area boundaries zip and
      any annual severity mosaics manually into data/raw/mtbs_burn_severity/. The connector
      reads whatever is present and reports the layer as unavailable otherwise.

  - id: landfire_fuels
    name: LANDFIRE Fire Behavior Fuel Model 40 and Canopy Cover (LFPS clips)
    provider: USGS / USFS LANDFIRE
    category: environment
    url: https://www.landfire.gov/
    # The ArcGIS GPServer submitJob endpoint now returns the LFPS web app's HTML; jobs are
    # submitted through the JSON API (GET /api/job/submit?Email=&Layer_List=&Area_of_Interest=
    # &Output_Projection=, polled at /api/job/status?JobId=, which reports outputFile).
    # Verified 2026-10-13: a 0.1-degree LF2022 FBFM40+CC job succeeded in under a minute.
    api_url: https://lfps.usgs.gov/api
    format: Multi-band GeoTIFF zip from an asynchronous geoprocessing job (Layer_List; Area_of_Interest as W S E N in WGS84)
    crs: EPSG:5070 (30 m)
    geographic_coverage: CONUS (clipped to the sampled address extent)
    temporal_coverage: LFPS serves LF2016, LF2022, LF2023, LF2024, LF2025 (verified product list); LF2001-LF2014 are manual downloads
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [LF2016_FBFM40, LF2016_CC, LF2022_FBFM40, LF2022_CC, LF2023_FBFM40, LF2023_CC, LF2024_FBFM40, LF2024_CC]
    notes: >
      Service metadata and product list verified; the submit/poll/download job flow follows
      the ArcGIS GPServer convention and is validated on first run. Outputs are stored under
      data/raw/landfire_fuels/<version>/. Older versions placed manually in the same layout
      (e.g. LF2001, LF2008, LF2010, LF2012, LF2014 with FBFM40/CC GeoTIFFs) are picked up
      automatically. Training years before the earliest available version use that version
      and record the lag in years as a feature (fuel_version_lag_years).

  - id: usgs_3dep_1as
    name: USGS 3DEP 1 arc-second seamless DEM
    provider: USGS National Map
    category: environment
    url: https://www.usgs.gov/3d-elevation-program
    download_pattern: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/{tile}/USGS_1_{tile}.tif
    format: GeoTIFF (1x1 degree tiles, ~28 MB each; tile id like n38w123)
    crs: EPSG:4269 (NAD83)
    geographic_coverage: CONUS
    temporal_coverage: Current seamless release
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    notes: >
      Elevation/slope/aspect are computed by windowed reads of the tiles covering sampled
      points (cached tiles). Slope uses Horn's method on a 3x3 window with pixel spacing
      converted to metres at the point's latitude.

