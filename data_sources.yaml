# CATRIX dataset registry — provenance, verification and version metadata.
#
# verification_status values:
#   verified      : endpoint reached from the development environment on `verified_on`
#                   and the listed fields were confirmed from the service metadata.
#   unverified    : endpoint documented by the provider but NOT reachable from the
#                   development environment (reason in `notes`). Connector is implemented
#                   against the provider's published schema and must be validated on first run.
#   local_only    : no stable programmatic download; the user must download manually and
#                   place the file under data/raw/<id>/ (instructions in `notes`).
#
# `last_ingested_at`, `record_count` and `version` are filled in by the pipeline
# (hazard_sources table) — this file records provenance, not ingestion state.

registry_version: "2026-10-13"

sources:
  - id: openaddresses_ca
    name: OpenAddresses — California county address points
    provider: OpenAddresses
    category: property_locations
    url: https://batch.openaddresses.io/data
    api_url: https://batch.openaddresses.io/api/data?source=us/ca&layer=addresses
    download_pattern: https://batch.openaddresses.io/api/job/{job_id}/output/source.geojson.gz
    format: GeoJSON (newline-delimited, gzip)
    crs: EPSG:4326
    geographic_coverage: California counties with published sources (us/ca/*)
    temporal_coverage: Rolling; each job carries an `updated` timestamp
    licence: Per-source (mostly public domain / CC-BY / ODbL; see each source JSON in the openaddresses GitHub repo)
    auth_required: true
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [number, street, unit, city, district, region, postcode, id, hash]
    notes: >
      The /api/data listing is public and was verified (e.g. us/ca/alameda job 926561, 27.5 MB).
      The job output download returned HTTP 403 without a session token; a free account at
      batch.openaddresses.io provides one (CATRIX_OPENADDRESSES_TOKEN). Alternatively drop a
      downloaded source.geojson(.gz) or OpenAddresses CSV into data/raw/openaddresses_ca/.
      Address points are NOT one-to-one with buildings.

  - id: census_tiger_counties
    name: US Census TIGER/Line counties (2023)
    provider: US Census Bureau
    category: regions
    url: https://www2.census.gov/geo/tiger/TIGER2023/COUNTY/tl_2023_us_county.zip
    format: Shapefile (zip, 83 MB, national)
    crs: EPSG:4269
    geographic_coverage: United States (filtered to STATEFP = '06')
    temporal_coverage: "2023 vintage"
    licence: Public domain (US Government)
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [STATEFP, COUNTYFP, GEOID, NAME, NAMELSAD, ALAND, AWATER]
    notes: Used to assign county to every location and to clip to California.

  - id: ms_building_footprints_ca
    name: Microsoft US Building Footprints — California
    provider: Microsoft
    category: buildings
    url: https://github.com/microsoft/usbuildingfootprints
    download_url: https://minedbuildings.z5.web.core.windows.net/legacy/usbuildings-v2/California.geojson.zip
    format: GeoJSON (zip, 466 MB)
    crs: EPSG:4326
    geographic_coverage: California (~11 million polygons)
    temporal_coverage: Imagery 2014–2020 (v2 release)
    licence: ODbL
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [release, capture_dates_range]
    notes: >
      Large file; the connector streams the zip and keeps only polygons intersecting the
      bounding boxes of the sampled address counties. Address-to-building matching is a
      nearest-footprint heuristic (max 30 m) and carries an explicit uncertainty flag.

  - id: calfire_fire_perimeters
    name: CAL FIRE FRAP historical fire perimeters (all)
    provider: CAL FIRE Fire and Resource Assessment Program
    category: wildfire_history
    url: https://www.fire.ca.gov/what-we-do/fire-resource-assessment-program/fire-perimeters
    api_url: https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/California_Historic_Fire_Perimeters/FeatureServer/0
    format: ArcGIS FeatureServer (paged JSON/GeoJSON, maxRecordCount 2000)
    crs: EPSG:3857 (service); stored as EPSG:4326
    geographic_coverage: California
    temporal_coverage: 1878–present (23,334 perimeters on 2026-10-13; 4,580 since 2015)
    licence: Public (CAL FIRE FRAP open data); see service terms
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [OBJECTID, YEAR_, STATE, AGENCY, UNIT_ID, FIRE_NAME, INC_NUM, IRWINID, ALARM_DATE, CONT_DATE, CAUSE, C_METHOD, OBJECTIVE, GIS_ACRES, COMMENTS, COMPLEX_NAME, COMPLEX_ID, FIRE_NUM, DECADES]
    notes: >
      Historical completeness varies: pre-1950 coverage is sparse, and small fires (below
      10 acres timber / 50 acres grass historically) are under-mapped. ML labels use
      YEAR_ >= 1990 only, and absence of a perimeter is treated as "no mapped perimeter",
      not "no fire".

  - id: calfire_fhsz_2024
    name: CAL FIRE Fire Hazard Severity Zones (SRA 2022/23 + LRA 2024/25, combined)
    provider: CAL FIRE / Office of the State Fire Marshal
    category: wildfire_hazard
    url: https://www.fire.ca.gov/what-we-do/fire-resource-assessment-program/gis-mapping-and-data-analytics
    api_url: https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/fhsz24_5/FeatureServer/0
    format: ArcGIS FeatureServer (polygon, maxRecordCount 2000)
    crs: EPSG:3857 (service); stored as EPSG:4326
    geographic_coverage: California (State and Local Responsibility Areas)
    temporal_coverage: Current regulatory zones (SRA effective 2024-04-01; LRA phased 2025)
    licence: Public (CAL FIRE); see service terms
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [FHSZ, FHSZ_Description, FHSZ_7Class, SRA22_2, SRA_Previous]
    notes: >
      Present-day regulatory classification. It is NOT used as a predictor in the historical
      wildfire ML model (it post-dates the training years); it is reported as a hazard overlay.

