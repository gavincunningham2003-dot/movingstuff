    provider: USGS Earthquake Hazards Program
    category: earthquake_hazard
    url: https://www.usgs.gov/programs/earthquake-hazards/science/national-seismic-hazard-model
    api_url: https://earthquake.usgs.gov/ws/building-codes/asce7-16/calculate?latitude={lat}&longitude={lon}&riskCategory=II&siteClass=D&title=catrix
    format: JSON point service
    crs: EPSG:4326
    geographic_coverage: United States
    temporal_coverage: ASCE 7-16 (2014 NSHM); model version v4.0.x
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [pga, pgam, pgauh, ss, s1, sds, sd1, sdc, sdcs]
    notes: >
      `pgauh` is the uniform-hazard PGA with 2% probability of exceedance in 50 years
      (site class B/C reference). `pga`/`pgam` are code-adjusted MCE_G values. The platform
      reports pgauh (horizon 2%/50y) as the quantitative indicator.

