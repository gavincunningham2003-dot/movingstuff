  - id: mrlc_nlcd
    name: MRLC National Land Cover Database epochs via WCS (30 m)
    provider: MRLC / USGS
    category: environment
    url: https://www.mrlc.gov/
    api_url: https://www.mrlc.gov/geoserver/ows?service=WCS&version=2.0.1&request=GetCoverage&coverageId=mrlc_download__NLCD_{year}_Land_Cover_L48&subset=X({minx},{maxx})&subset=Y({miny},{maxy})&format=image/geotiff
    format: GeoTIFF via OGC WCS 2.0.1 GetCoverage (subset in EPSG:5070 metres, axes X Y)
    crs: EPSG:5070
    geographic_coverage: CONUS (clipped to 0.5-degree tiles around sampled addresses)
    temporal_coverage: Epochs 2001, 2004, 2006, 2008, 2011, 2013, 2016, 2019, 2021 (verified coverage ids)
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [mrlc_download__NLCD_2001_Land_Cover_L48, mrlc_download__NLCD_2021_Land_Cover_L48]
    notes: >
      GetCapabilities and DescribeCoverage verified (597 coverages; NLCD_2021_Land_Cover_L48
      is EPSG:5070 with X/Y axes). Annual NLCD 1985-2023 exists only as CONUS bundles and can
      be dropped into data/raw/mrlc_nlcd/<year>/ manually. Training years use the latest
      epoch at or before T; years before 2001 use 2001 with the lag recorded
      (lc_version_lag_years).

