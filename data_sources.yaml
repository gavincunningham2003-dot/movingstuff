  - id: cgs_seismic_hazard_zones
    name: CGS Seismic Hazard Zones — Liquefaction Zones (official regulatory zones)
    provider: California Geological Survey
    category: liquefaction_hazard
    url: https://www.conservation.ca.gov/cgs/sh/program
    # CGS publishes the official zones on ArcGIS Online (owner gis_cadoc), one feature service
    # per zone type: CGS_Liquefaction_Zones, CGS_Landslide_Zones, CGS_SHZ_Unevaluated_Areas.
    # www.conservation.ca.gov itself refused connections from the authoring network (also via
    # VPN) on 2026-10-13; ArcGIS Online is reachable. Verified: 2,034 polygons, fields
    # OBJECTID, QUAD_NAME, RELEASED, REVISED, PREV_DATES, GEOPDFLINK, REPORTLINK, COMMENTS.
    api_url: https://services2.arcgis.com/zr3KAIbsRSUyARHG/arcgis/rest/services/CGS_Liquefaction_Zones/FeatureServer/0
    format: ArcGIS FeatureServer (polygon); shapefile also accepted locally
    crs: EPSG:3857 (service) / EPSG:4326 (query)
    geographic_coverage: Mapped quadrangles only (urban Southern CA and Bay Area); NOT statewide
    temporal_coverage: Zones released 1997-present (RELEASED per polygon)
    licence: Public (CGS)
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [QUAD_NAME, RELEASED, REVISED]
    notes: >
      Every polygon is a liquefaction zone; the quadrangle name is stored as the
      classification attribute and the module reports "Liquefaction zone". Locations outside
      mapped quadrangles are reported as "outside_coverage", never as "no hazard". The
      companion CGS_SHZ_Unevaluated_Areas service (2,748 quadrangle polygons) could be used
      to tell "evaluated, not zoned" from "never evaluated"; not yet wired in.

  - id: fema_nfhl
    name: FEMA National Flood Hazard Layer — Flood Hazard Areas (layer 28)
    provider: FEMA
    category: flood_hazard
    url: https://www.fema.gov/flood-maps/national-flood-hazard-layer
    # FEMA's own host (hazards.fema.gov/arcgis/.../NFHL/MapServer/28) geo-blocks non-US
    # networks. Esri's Living Atlas mirror of the same S_FLD_HAZ_AR layer (reduced attribute
    # set, same field names, maintained from FEMA releases) is used instead.
    api_url: https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/USA_Flood_Hazard_Reduced_Set_gdb/FeatureServer/0
    format: ArcGIS MapServer (polygon query)
    crs: EPSG:4269 (service) / EPSG:3857 (query)
    geographic_coverage: Mapped communities (gaps exist; unmapped is not low risk)
    temporal_coverage: Effective FIRMs as currently published
    licence: Public domain
    auth_required: false
    verified_on: "2026-10-13"
    verification_status: verified
    fields: [DFIRM_ID, FLD_AR_ID, FLD_ZONE, ZONE_SUBTY, SFHA_TF, STATIC_BFE, DEPTH, VELOCITY]
    notes: >
      hazards.fema.gov resets every TCP connection from non-US networks (confirmed with
      curl, TLS verification off, on 2026-10-13: a geo-block, not certificate interception).
      The Esri Living Atlas "USA Flood Hazard Areas" service mirrors S_FLD_HAZ_AR with the
      same field names (DFIRM_ID, FLD_AR_ID, FLD_ZONE, ZONE_SUBTY, SFHA_TF, STATIC_BFE,
      DEPTH, VELOCITY all confirmed; 4.4M polygons nationwide, maxRecordCount 750) and is
      used instead. The connector also accepts a locally downloaded NFHL state GDB/shapefile.

